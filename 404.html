<script>
(function(){
  var navTimer = document.getElementById('navTimerVal');
  if (!navTimer) return;
  var EXAMS = [
    { shortName: 'Maths', date: new Date('2026-11-17T14:30:00+05:30'), endDate: new Date('2026-11-17T16:30:00+05:30') },
    { shortName: 'DSGT',  date: new Date('2026-11-19T14:30:00+05:30'), endDate: new Date('2026-11-19T17:30:00+05:30') },
    { shortName: 'AOA',   date: new Date('2026-11-21T14:30:00+05:30'), endDate: new Date('2026-11-21T16:30:00+05:30') },
    { shortName: 'COA',   date: new Date('2026-11-25T14:30:00+05:30'), endDate: new Date('2026-11-25T16:30:00+05:30') },
    { shortName: 'Gen AI',date: new Date('2026-11-27T14:30:00+05:30'), endDate: new Date('2026-11-27T16:30:00+05:30') }
  ];
  function updateNavTimer(){
    var nowMs = Date.now();
    var active = null;
    for (var i = 0; i < EXAMS.length; i++) {
      if (nowMs < EXAMS[i].endDate.getTime()) { active = EXAMS[i]; break; }
    }
    if (!active) { navTimer.textContent = 'Exams Done 🎉'; return; }
    var diff = active.date.getTime() - nowMs;
    if (diff <= 0) { navTimer.textContent = active.shortName + ' Live Now ⚡'; return; }
    var d = Math.floor(diff / (1000 * 60 * 60 * 24));
    var h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var m = Math.floor((diff / (1000 * 60)) % 60);
    var s = Math.floor((diff / 1000) % 60);
    navTimer.textContent = active.shortName + ' · ' + d + 'd ' + h + 'h ' + m + 'm ' + s + 's';
  }
  updateNavTimer();
  setInterval(updateNavTimer, 1000);
})();
</script>
